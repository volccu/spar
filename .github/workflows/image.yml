name: image

# The container image (Dockerfile): built for amd64 and arm64 and pushed to the
# GitHub Container Registry on every version tag, as ghcr.io/<owner>/<repo>
# with the version and `latest`. A pull request that touches what goes into
# the image builds it (amd64, not pushed) and runs it once.
#
# A tag does not start this workflow by itself: check.yml calls it once every
# check has passed on the tagged commit (audit CODE-3), so a failing suite never
# reaches the registry. Inside that call `github.ref` is still the tag.

on:
  workflow_call:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - server/**
      - web/**
      - supabase/functions/_shared/**
      - package.json
      - package-lock.json
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    # Called from check.yml on a tag push (the event is the caller's, `push`),
    # or started by hand.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 on an amd64 runner)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the image and its tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lower-cases the name, as the registry requires.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: image-check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (linux/amd64, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: spar:check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run it once
        run: |
          docker run -d --name spar-check -p 127.0.0.1:8080:8080 spar:check
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/config.json | grep -q '"backend":"spar-server"'
          curl -fsS http://127.0.0.1:8080/ | grep -q 'id="root"'
          docker stop spar-check
          test "$(docker inspect spar-check --format '{{.State.ExitCode}}')" = 0

      - name: Show the logs
        if: always()
        run: docker logs spar-check || true
